
name: Build Product Label Maker APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          echo "Checking pubspec.yaml"
          cat pubspec.yaml
          test -s lib/main.dart
          grep -q 'sdk:' pubspec.yaml

      - name: Create Android platform without replacing app files
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.productlabelmaker \
              --project-name product_label_maker \
              /tmp/plm_android

            cp -R /tmp/plm_android/android ./android
          fi

      - name: Setup Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: product-label-maker-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
